[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linepy"
version = "0.1.0"
description = "LINE SelfBot library for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "fujinami" }
]
keywords = ["line", "selfbot", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx[http2]>=0.25.0",
    "pyaes>=1.6.1",
    "qrcode>=7.4.0",
    "xxhash>=3.4.0",
]
# No pydantic: models are plain stdlib dataclasses (linepy._model_base).
# pydantic-core (its Rust validation engine) has no iOS wheels and no
# pure-Python fallback, so it can never install on sandboxed/no-compiler
# environments like a-Shell on iOS -- see linepy/_model_base.py.
#
# No pycryptodome/cryptography/pynacl either: all of them require C or Rust
# extensions with no iOS wheels, so they can never install on a-Shell either.
# AES/RSA/X25519/HKDF/AES-GCM-SIV are implemented in pure Python on top of
# `pyaes` (itself pure-Python) in linepy/_purecrypto.py.

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["linepy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
